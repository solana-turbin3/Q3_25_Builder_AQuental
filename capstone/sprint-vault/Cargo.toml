[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = false
lto = "fat"
codegen-units = 1
opt-level = 2  # Balance between size and performance

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[profile.dev]
opt-level = 2  # Enable some optimizations in dev mode
overflow-checks = true
