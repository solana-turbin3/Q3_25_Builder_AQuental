[target.bpfel-unknown-unknown]
rustflags = [
    "-C", "link-arg=-zstack-size=8192",
    "-C", "opt-level=2",
    "-C", "overflow-checks=false",
    "-C", "inline-threshold=5"
]

[target.sbf-solana-solana]
rustflags = [
    "-C", "link-arg=-zstack-size=8192",
    "-C", "opt-level=2",
    "-C", "overflow-checks=false",
    "-C", "inline-threshold=5"
]

[profile.release]
opt-level = 2
overflow-checks = false
lto = "fat"
codegen-units = 1

[profile.release.package."*"]
opt-level = 2
overflow-checks = false
